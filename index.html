<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致玉蘭的情人節驚喜 ❤️</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>最親愛的玉蘭：</strong>
                        <p>在這個浪漫的日子裡，我想把最真心的話留給妳。</p>
                        <p>最近我的生活過得比較拮据，所以沒辦法送妳什麼貴重的禮物，心裡真的覺得有點過意不去...</p>
                        <p class="highlight">但我答應妳，以後我一定會補償給妳的！✨</p>
                        <p>謝謝妳一直都在我身邊，陪我度過這些平凡卻珍貴的日子。情人節快樂，我的專屬女孩。</p>
                        <div class="signature">愛妳的 [寶寶] <br> 2026.03.11</div>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
        <p class="hint">點擊心形，接收我的真心 ❤️</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
