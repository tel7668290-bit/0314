<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致玉蘭的情人節驚喜 ❤️</title>
    <style>
        /* 基礎設定與背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', 'PingFang TC', serif; /* 更文青的字體配方 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 隱藏滾動條，讓背景全屏呈現 */
            background: linear-gradient(315deg, #ffe6ea 0%, #f5d0d6 74%); /* 溫柔的粉色漸層 */
        }

        /* 質感毛玻璃卡片 (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px); /* 磨砂玻璃效果 */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(220, 100, 130, 0.15); /* 輕柔的陰影 */
            padding: 40px 30px;
            max-width: 400px;
            width: 85%;
            position: relative;
            z-index: 10;
        }

        /* 初始畫面：跳動的愛心按鈕 */
        #intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            transition: opacity 0.5s ease;
        }

        .heart-btn {
            font-size: 70px;
            color: #d6336c;
            cursor: pointer;
            animation: heartbeat 1.5s infinite;
            margin-bottom: 20px;
            user-select: none;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊藍色高亮 */
        }
        
        .heart-btn:active {
            transform: scale(0.9) !important; /* 點擊時縮小 */
        }

        .hint-text {
            color: #d87093;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* 信件內容 (初始隱藏) */
        #letter {
            display: none;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        h1 {
            color: #d6336c;
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ffb3c6;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            color: #555;
            line-height: 1.8;
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: justify; /* 文字兩端對齊 */
        }

        .signature {
            text-align: right;
            margin-top: 35px;
            font-weight: bold;
            color: #d6336c;
            font-size: 1.1rem;
        }

        .date {
            text-align: right;
            font-size: 0.9rem;
            color: #999;
            margin-top: 5px;
        }

        /* 精緻相冊區 */
        .photo-album {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 30px;
            border-top: 1px dashed rgba(220, 100, 130, 0.2);
            padding-top: 20px;
        }

        .album-photo {
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* 保持 1:1 正方形 */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(220, 100, 130, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .album-photo:hover {
            transform: scale(1.06); /* 懸停輕微放大 */
            box-shadow: 0 6px 15px rgba(220, 100, 130, 0.12);
        }

        /* 動畫效果定義 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 背景漂浮愛心效果 */
        .bg-heart {
            position: absolute;
            color: rgba(255, 182, 193, 0.4); /* 半透明粉色 */
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none; /* 防止滑鼠滑過時影響 */
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div class="card">
        <div id="intro">
            <div class="heart-btn" onclick="openLetter()">❤️</div>
            <div class="hint-text">點擊心形，接收我的真心</div>
        </div>

        <div id="letter">
            <h1>給寶寶的情人節驚喜 ❤️</h1>
            
            <p><strong>寶寶：</strong></p>
            <p>白色情人節快樂！❤️</p>
            <p>最近手頭比較緊，沒辦法帶妳去吃大餐或送什麼厲害的禮物，最近又收到你的禮物，就覺得有點不好意思，覺得委屈了妳。</p>
            <p>但真的很謝謝妳，總是這麼體貼(雖然有時候很愛生氣)。</p>
            <p>但我答應妳，這陣子過後我一定會把欠妳的浪漫通通補回來！✨</p>
            <p>謝謝妳一直都在。有妳在身邊，就是我最珍貴的禮物。</p>

            <div class="signature">最愛妳的 寶寶</div>
            <div class="date">2026.03.14</div>

            <div class="photo-album">
                <div class="album-photo" style="background-image: url('S__142032900_0.jpg');"></div>
                <div class="album-photo" style="background-image: url('S__142032901_0.jpg');"></div>
                <div class="album-photo" style="background-image: url('S__142032902_0.jpg');"></div>
            </div>
        </div>
    </div>

    <script>
        // 產生背景漂浮愛心的程式碼
        const bgContainer = document.getElementById('bg-container');
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = '❤';
            heart.classList.add('bg-heart');
            // 隨機生成位置、大小與動畫時間
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            bgContainer.appendChild(heart);
        }

        // 點擊愛心打開信件的特效
        function openLetter() {
            const intro = document.getElementById('intro');
            const letter = document.getElementById('letter');
            
            // 讓跳動愛心淡出
            intro.style.opacity = '0';
            
            // 等待淡出動畫結束後，顯示信件內容
            setTimeout(() => {
                intro.style.display = 'none';
                letter.style.display = 'block';
                // 信件內容淡入動畫由 CSSfadeIn 處理
            }, 500); 
        }
    </script>
</body>
</html>
