<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給寶寶的情人節禮物❤️</title>
    <style>
        /* --- 基礎設定與背景 --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', 'PingFang TC', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(315deg, #ffe6ea 0%, #f5d0d6 74%);
        }

        /* --- 質感毛玻璃卡片 --- */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(220, 100, 130, 0.15);
            padding: 30px 25px; /* 稍微縮小內邊距以適應手機 */
            max-width: 400px;
            width: 85%;
            max-height: 85vh; 
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            z-index: 10;
        }
        .card::-webkit-scrollbar {
            display: none;
        }

        /* --- 初始畫面：跳動的愛心按鈕 --- */
        #intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            transition: opacity 0.5s ease;
        }
        .heart-btn {
            font-size: 70px;
            color: #d6336c;
            cursor: pointer;
            animation: heartbeat 1.5s infinite;
            margin-bottom: 20px;
            user-select: none;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .heart-btn:active { transform: scale(0.9) !important; }
        .hint-text {
            color: #d87093;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* --- 信件內容 --- */
        #letter {
            display: none;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }
        h1 {
            color: #d6336c;
            font-size: 1.3rem; /* 標題稍微縮小一點 */
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ffb3c6;
            padding-bottom: 12px;
            letter-spacing: 1px;
        }
        p {
            color: #555;
            line-height: 1.6; /* 稍微縮小行距 */
            font-size: 1rem;   /* 稍微縮小字體 */
            margin-bottom: 12px;
            text-align: justify;
        }
        .signature {
            text-align: right;
            margin-top: 25px; /* 減少上方距離 */
            font-weight: bold;
            color: #d6336c;
            font-size: 1.05rem;
        }
        .date {
            text-align: right;
            font-size: 0.85rem;
            color: #999;
            margin-top: 3px;
        }

        /* --- 照片區：直接顯示，移至上方 --- */
        .photo-album {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px; /* 照片和文字之間的距離 */
        }

        .album-photo {
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* 正方形 */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(220, 100, 130, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .album-photo:hover {
            transform: scale(1.06); 
            box-shadow: 0 6px 15px rgba(220, 100, 130, 0.12);
        }

        /* --- 動畫效果 --- */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-heart {
            position: absolute;
            color: rgba(255, 182, 193, 0.4);
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <audio id="bgMusic" loop preload="auto">
        <source src="videoplayback.mp4" type="audio/mp4">
    </audio>

    <div class="card">
        <div id="intro">
            <div class="heart-btn" onclick="openLetter()">❤️</div>
            <div class="hint-text">點擊心心</div>
        </div>

        <div id="letter">
            <h1>給寶寶的情人節驚喜 ❤️</h1>
            
            <div class="photo-album">
                <div class="album-photo" style="background-image: url('S__142032900_0.jpg');"></div>
                <div class="album-photo" style="background-image: url('S__142032901_0.jpg');"></div>
                <div class="album-photo" style="background-image: url('S__142032902_0.jpg');"></div>
            </div>
            
            <p><strong>寶寶：</strong></p>
            <p>白色情人節快樂！❤️</p>
            <p>最近手頭比較緊，沒辦法帶妳去吃大餐或送什麼厲害的禮物，最近又收到妳的禮物，就覺得有點不好意思，覺得委屈了妳。</p>
            <p>但真的很謝謝妳，總是這麼體貼(雖然有時候很愛生氣)。</p>
            <p>這陣子過後我一定會好好的補償妳的！✨</p>
            <p>謝謝妳一直都在。有妳在身邊，就是我最珍貴的禮物。</p>

            <div class="signature">最愛妳的 寶寶</div>
            <div class="date">2026.03.14</div>
            
        </div>
    </div>

    <script>
        // 1. 產生背景漂浮愛心
        const bgContainer = document.getElementById('bg-container');
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = '❤';
            heart.classList.add('bg-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            bgContainer.appendChild(heart);
        }

        // 2. 點擊愛心打開信件 ＋ 播放音樂特效
        function openLetter() {
            const intro = document.getElementById('intro');
            const letter = document.getElementById('letter');
            const bgMusic = document.getElementById('bgMusic');
            
            // 播放背景音樂
            bgMusic.play().catch(error => {
                console.log("自動播放被阻擋", error);
            });

            // 畫面切換動畫
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                letter.style.display = 'block';
            }, 500); 
        }
    </script>
</body>
</html>
