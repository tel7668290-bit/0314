<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致玉蘭的情人節驚喜 ❤️</title>
    <style>
        /* --- 基礎設定與背景 --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', 'PingFang TC', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(315deg, #ffe6ea 0%, #f5d0d6 74%);
        }

        /* --- 質感毛玻璃卡片 --- */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(220, 100, 130, 0.15);
            padding: 40px 30px;
            max-width: 400px;
            width: 85%;
            /* 為了容納影片，讓卡片內容過長時可以滾動，但隱藏滾動條 */
            max-height: 85vh; 
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
            position: relative;
            z-index: 10;
        }
        .card::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* --- 初始畫面：跳動的愛心按鈕 --- */
        #intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            transition: opacity 0.5s ease;
        }
        .heart-btn {
            font-size: 70px;
            color: #d6336c;
            cursor: pointer;
            animation: heartbeat 1.5s infinite;
            margin-bottom: 20px;
            user-select: none;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .heart-btn:active { transform: scale(0.9) !important; }
        .hint-text {
            color: #d87093;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* --- 信件內容 --- */
        #letter {
            display: none;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }
        h1 {
            color: #d6336c;
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ffb3c6;
            padding-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            color: #555;
            line-height: 1.8;
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: justify;
        }
        .signature {
            text-align: right;
            margin-top: 35px;
            font-weight: bold;
            color: #d6336c;
            font-size: 1.1rem;
        }
        .date {
            text-align: right;
            font-size: 0.9rem;
            color: #999;
            margin-top: 5px;
        }

        /* --- 互動解鎖區：相片與影片 --- */
        .media-section {
            margin-top: 30px;
            border-top: 1px dashed rgba(220, 100, 130, 0.2);
            padding-top: 20px;
        }

        /* 1. 照片九宮格 (排3張) */
        .photo-album {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px; /* 與下方影片區隔開 */
        }

        .album-item {
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* 正方形 */
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(220, 100, 130, 0.08);
            background-color: rgba(220, 100, 130, 0.05); /* 溫柔的預設底色 */
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        /* 佔位圖標 (愛心) */
        .album-item::before {
            content: '❤';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: rgba(214, 51, 108, 0.4);
            transition: all 0.3s ease;
            z-index: 2; /* 確保在圖片上方 */
        }

        /* 實際隱藏的照片 (一開始透明度為 0) */
        .album-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 填滿且不變形 */
            opacity: 0;
            transition: opacity 0.8s ease; /* 淡入動畫 */
            z-index: 1;
        }

        /* 照片解鎖後的狀態 */
        .album-item.revealed { cursor: default; }
        .album-item.revealed::before { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        .album-item.revealed .album-photo { opacity: 1; }
        .album-item.revealed:hover { transform: scale(1.06); box-shadow: 0 6px 15px rgba(220, 100, 130, 0.12); }
        
        /* 未解鎖懸停提示 */
        .album-item:not(.revealed):hover { background-color: rgba(220, 100, 130, 0.15); transform: scale(1.03); }
        .album-item:not(.revealed):hover::before { transform: translate(-50%, -50%) scale(1.2); color: rgba(214, 51, 108, 0.7); }


        /* 2. 影片專屬區塊 (寬版) */
        .video-item {
            width: 100%;
            aspect-ratio: 16 / 9; /* 常見影片比例 */
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(220, 100, 130, 0.08);
            background-color: rgba(220, 100, 130, 0.05);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 影片佔位圖標 (播放鍵) */
        .video-item::before {
            content: '▶'; /* 播放圖示 */
            position: absolute;
            font-size: 2rem;
            color: rgba(214, 51, 108, 0.5);
            transition: all 0.3s ease;
            z-index: 2;
        }

        /* 實際隱藏的影片 */
        .album-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 1;
            display: none; /* 初始完全隱藏，避免點擊到控制列 */
        }

        /* 影片解鎖後的狀態 */
        .video-item.revealed { cursor: default; }
        .video-item.revealed::before { opacity: 0; transform: scale(0.5); }
        .video-item.revealed .album-video { display: block; opacity: 1; }
        
        /* 未解鎖影片懸停提示 */
        .video-item:not(.revealed):hover { background-color: rgba(220, 100, 130, 0.15); transform: scale(1.02); }
        .video-item:not(.revealed):hover::before { transform: scale(1.2); color: rgba(214, 51, 108, 0.8); }


        /* --- 動畫效果定義 --- */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 背景漂浮愛心效果 --- */
        .bg-heart {
            position: absolute;
            color: rgba(255, 182, 193, 0.4);
            animation: floatUp linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div class="card">
        <div id="intro">
            <div class="heart-btn" onclick="openLetter()">❤️</div>
            <div class="hint-text">點擊心形，接收我的真心</div>
        </div>

        <div id="letter">
            <h1>給寶寶的情人節驚喜 ❤️</h1>
            
            <p><strong>寶寶：</strong></p>
            <p>白色情人節快樂！❤️</p>
            <p>最近手頭比較緊，沒辦法帶妳去吃大餐或送什麼厲害的禮物，最近又收到妳的禮物，就覺得有點不好意思，覺得委屈了妳。</p>
            <p>但真的很謝謝妳，總是這麼體貼(雖然有時候很愛生氣)。</p>
            <p>但我答應妳，這陣子過後我一定會把欠妳的浪漫通通補回來！✨</p>
            <p>謝謝妳一直都在。有妳在身邊，就是我最珍貴的禮物。</p>

            <div class="signature">最愛妳的 寶寶</div>
            <div class="date">2026.03.14</div>

            <div class="media-section">
                <div class="photo-album">
                    <div class="album-item" onclick="revealMedia(this)">
                        <img src="S__142032900_0.jpg" alt="回憶1" class="album-photo">
                    </div>
                    <div class="album-item" onclick="revealMedia(this)">
                        <img src="S__142032901_0.jpg" alt="回憶2" class="album-photo">
                    </div>
                    <div class="album-item" onclick="revealMedia(this)">
                        <img src="S__142032902_0.jpg" alt="回憶3" class="album-photo">
                    </div>
                </div>

                <div class="video-item" onclick="revealMedia(this)">
                    <video class="album-video" controls>
                        <source src="videoplayback.mp4" type="video/mp4">
                        您的瀏覽器不支援影片播放。
                    </video>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // 1. 產生背景漂浮愛心
        const bgContainer = document.getElementById('bg-container');
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.innerHTML = '❤';
            heart.classList.add('bg-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            bgContainer.appendChild(heart);
        }

        // 2. 打開信件的特效
        function openLetter() {
            const intro = document.getElementById('intro');
            const letter = document.getElementById('letter');
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                letter.style.display = 'block';
            }, 500); 
        }

        // 3. 解鎖媒體 (照片或影片) 的通用函數
        function revealMedia(element) {
            // 如果已經解鎖過，就不執行後續動作
            if (element.classList.contains('revealed')) return;
            
            // 加入 'revealed' class，觸發 CSS 的淡入動畫和隱藏圖標
            element.classList.add('revealed');

            // 如果點擊的是影片區塊，嘗試自動播放
            const video = element.querySelector('video');
            if (video) {
                // 給一點延遲等淡入動畫跑完再播放，體驗更好
                setTimeout(() => {
                    video.play().catch(error => {
                        console.log("瀏覽器阻擋自動播放，請手動點擊播放", error);
                    });
                }, 400); 
            }
        }
    </script>
</body>
</html>
